{% load icons i18n %}

<section class="section section--card section--parallax" id="about">
  <div class="container">
    <span class="section-label js-reveal">{% trans "О компании" %}</span>
    <h2 class="section-title js-reveal">{{ about.title }}</h2>

    <div class="about__grid">
      <div class="about__philosophy js-reveal">
        <h3 class="about__philosophy-title">{{ about.philosophy_title }}</h3>
        <div class="about__philosophy-text">{{ about.philosophy_text|linebreaksbr }}</div>
      </div>

      <div class="about__deco">
        {% for s in stats %}
          <div class="about__stat-pill js-reveal">
            <span class="about__stat-num">{{ s.value }}</span>
            <span class="about__stat-lbl">{{ s.label }}</span>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
