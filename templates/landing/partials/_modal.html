{% load icons i18n %}

<div class="modal-overlay" id="hero-modal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal__header">
      <h2 class="modal__title" id="modal-title">{{ contact.form_title }}</h2>
      <button class="modal__close" data-close-modal aria-label="{% trans 'Закрыть' %}">&times;</button>
    </div>

    <div id="modal-form-area">
      {% include "landing/partials/_lead_form.html" with form_target="#modal-form-area" form_id_prefix="modal" %}
    </div>
  </div>
</div>
