{% load static icons i18n %}

<section class="hero" id="hero">
  <div class="hero__bg"></div>

  <div class="hero__inner">
    <span class="hero__badge js-reveal">CHIP TUNING & ECU CALIBRATION</span>

    {% if site.logo %}
      <img src="{{ site.logo.url }}" alt="DISTAGE" class="hero__logo-mini js-reveal" width="200" height="100">
    {% endif %}

    <h1 class="hero__title js-reveal">{{ hero.title }}</h1>

    <p class="hero__subtitle js-reveal">{{ hero.subtitle }}</p>

    <div class="hero__actions js-reveal">
      <button class="btn btn--accent" data-open-modal>
        {{ hero.btn_buy_text }}
      </button>
      <a href="#services" class="btn btn--outline">
        {{ hero.btn_sell_text }}
      </a>
    </div>

    <div class="hero__scroll js-reveal">
      <span>{% trans "Узнать больше" %}</span>
      <div class="hero__scroll-line"></div>
      {% icon "scroll-down" %}
    </div>
  </div>
</section>
