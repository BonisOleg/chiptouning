{% load icons %}

<section class="stats" id="stats">
  <div class="container">
    <div class="stats__grid">
      {% for stat in stats %}
        <div class="stat-item js-reveal">
          <span class="stat-item__value">{{ stat.value }}</span>
          <span class="stat-item__label">{{ stat.label }}</span>
          <div class="stats__divider"></div>
        </div>
      {% endfor %}
    </div>
  </div>
</section>
