{% load icons i18n %}

<section class="section section--darker" id="services">
  <div class="container">
    <span class="section-label js-reveal">{% trans "Что мы делаем" %}</span>
    <h2 class="section-title js-reveal">{{ services_section.title }}</h2>

    <div class="services__tabs js-reveal" role="tablist">
      <button class="services__tab active" role="tab" aria-selected="true" data-tab="removal">
        {% trans "Удаление систем" %}
      </button>
      <button class="services__tab" role="tab" aria-selected="false" data-tab="tuning">
        {% trans "Настройка мощности" %}
      </button>
    </div>

    <div class="services__panel active" data-panel="removal">
      <div class="services__grid">
        {% for svc in service_cat1 %}
          <div class="service-card js-reveal">
            <div class="service-card__icon">
              {% icon svc.icon_key %}
            </div>
            <div class="service-card__body">
              <h3 class="service-card__title">{{ svc.title }}</h3>
              <p class="service-card__text">{{ svc.description }}</p>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>

    <div class="services__panel" data-panel="tuning">
      <div class="services__grid">
        {% for svc in service_cat2 %}
          <div class="service-card js-reveal">
            <div class="service-card__icon">
              {% icon svc.icon_key %}
            </div>
            <div class="service-card__body">
              <h3 class="service-card__title">{{ svc.title }}</h3>
              <p class="service-card__text">{{ svc.description }}</p>
            </div>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</section>
