services:
  - type: web
    name: distage-landing
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --no-input && python manage.py seed
    startCommand: ./start.sh
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.render
      - key: DATABASE_URL
        fromDatabase:
          name: distage-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: LEAD_NOTIFICATION_EMAIL
        sync: false

databases:
  - name: distage-db
    databaseName: distage_db
    user: distage_user
